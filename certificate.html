<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate Verification | Creomind Innovations</title>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="text-gray-800 bg-cover bg-center"
  style="background-image: url('https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&fit=crop&w=1950&q=80');">

<!-- ================= NAVBAR ================= -->
<header class="fixed w-full z-10 bg-white shadow">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <img src="assets/logo.png" alt="Creomind Innovations" class="h-16 w-auto" />

    <button id="hamburger" class="md:hidden">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <nav class="hidden md:flex space-x-6 font-medium">
      <a href="index.html" class="hover:text-blue-500">Home</a>
      <a href="about.html" class="hover:text-blue-500">About</a>
      <a href="services.html" class="hover:text-blue-500">Services</a>
      <a href="testimonials.html" class="hover:text-blue-500">Testimonials</a>
      <a href="certificate.html" class="text-blue-600 font-semibold border-b-2 border-blue-600">Verify</a>
      <a href="careers.html" class="hover:text-blue-500">Careers</a>
      <a href="contact.html" class="hover:text-blue-500">Contact</a>
    </nav>
  </div>

  <div id="mobileMenu" class="hidden md:hidden bg-white px-4 pb-4">
    <a href="index.html" class="block py-2">Home</a>
    <a href="about.html" class="block py-2">About</a>
    <a href="services.html" class="block py-2">Services</a>
    <a href="testimonials.html" class="block py-2">Testimonials</a>
    <a href="certificate.html" class="block py-2 font-semibold text-blue-600">Verify</a>
    <a href="careers.html" class="block py-2">Careers</a>
    <a href="contact.html" class="block py-2">Contact</a>
  </div>
</header>

<!-- ================= MAIN CONTENT ================= -->
<main class="flex items-center justify-center min-h-screen pt-32 pb-20">
  <div class="bg-white p-8 rounded-xl shadow-xl max-w-md w-full text-center">
    <h1 class="text-2xl font-bold text-indigo-700 mb-6">🎓 Certificate Verification</h1>

    <input
      id="certIdInput"
      type="text"
      placeholder="Enter Certificate ID"
      class="w-full px-4 py-2 border rounded mb-4 focus:ring-2 focus:ring-indigo-500"
    />

    <button
      onclick="verifyCertificate()"
      class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700 w-full">
      Verify Certificate
    </button>

    <!-- Result -->
    <div id="resultSection" class="hidden mt-6">
      <div class="bg-green-100 border border-green-300 text-left p-4 rounded">
        <p><strong>Certificate ID:</strong> <span id="resultId"></span></p>
        <p><strong>Name:</strong> <span id="resultName"></span></p>
        <p><strong>Issued On:</strong> <span id="resultDate"></span></p>
        <p><strong>Course:</strong> <span id="resultCourse"></span></p>
        <p class="text-green-700 font-semibold mt-2">✅ Verified</p>
      </div>
    </div>

    <!-- Error -->
    <div id="errorSection" class="hidden mt-6 text-red-600 font-medium">
      ❌ Certificate not found. Please check the ID.
    </div>
  </div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="bg-gray-800 text-white py-8">
  <div class="max-w-6xl mx-auto text-center">
    <h3 class="text-xl font-bold">Creomind Innovations</h3>
    <p class="text-gray-400 text-sm mt-2">© 2025 All rights reserved</p>
  </div>
</footer>

<!-- ================= SCRIPTS ================= -->
<script>
  // Mobile menu
  document.getElementById("hamburger").onclick = () =>
    document.getElementById("mobileMenu").classList.toggle("hidden");

  // Certificate verification (Google Sheets)
  async function verifyCertificate() {
    const certId = document.getElementById("certIdInput").value.trim().toUpperCase();
    const resultSection = document.getElementById("resultSection");
    const errorSection = document.getElementById("errorSection");

    const sheetUrl =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5hi_v02quFOLT8OFXIbMBMEXmQl0eBl5Ds_LaUbV9MokW2KmUIwLw3Yesx49cQm0418vT9VrOF1rO/pub?output=csv";

    try {
      const res = await fetch(sheetUrl);
      const csv = await res.text();
      const rows = csv.split("\n").map(r => r.split(",").map(c => c.trim()));

      let found = false;

      for (let i = 1; i < rows.length; i++) {
        if (rows[i].length < 4) continue;
        const [id, name, date, course] = rows[i];

        if (id.toUpperCase() === certId) {
          document.getElementById("resultId").innerText = id;
          document.getElementById("resultName").innerText = name;
          document.getElementById("resultDate").innerText = date;
          document.getElementById("resultCourse").innerText = course;

          resultSection.classList.remove("hidden");
          errorSection.classList.add("hidden");
          found = true;
          break;
        }
      }

      if (!found) {
        resultSection.classList.add("hidden");
        errorSection.classList.remove("hidden");
      }

    } catch (err) {
      console.error(err);
      errorSection.innerText = "⚠️ Error fetching certificate data.";
      errorSection.classList.remove("hidden");
      resultSection.classList.add("hidden");
    }
  }
</script>

</body>
</html>
